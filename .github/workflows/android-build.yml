name: Android Build & Release Workflow

on:
  push:
    branches: [ main, master, "tiny-focus-circles-*" ]
    tags:
      - 'v*'
      - '1.0.0*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-focus-circles-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.0
          name: Release 1.0.0 - Tiny Focus Circles Android APK
          body: |
            ## Tiny Focus Circles Android Release 1.0.0

            - Native Kotlin + Jetpack Compose Android Application
            - Real-Time WebSockets timer synchronization & room chat
            - Standing Circles & Drop-In rooms support
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
